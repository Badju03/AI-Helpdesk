<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI IT Helpdesk Assistant</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="app-container">

        <!-- HEADER -->

        <header class="app-header">

            <div class="header-left">

                <div class="ai-icon">
                    🤖
                </div>

                <div>

                    <h1>AI IT Helpdesk Assistant</h1>

                    <p>Intelligent IT Troubleshooting</p>

                </div>

            </div>

            <div class="online-status">

                <span class="status-dot"></span>

                Online

            </div>

        </header>


        <!-- CHAT AREA -->

        <main id="chatWindow">

            <!-- Welcome -->

            <div class="welcome-message">

                <div class="welcome-icon">
                    👋
                </div>

                <h2>Welcome to your AI IT Helpdesk</h2>

                <p>
                    Get guided troubleshooting for common IT issues.
                </p>

            </div>


            <!-- CATEGORY BUTTONS -->

            <div class="button-container">

                <button
                    class="chat-option category-button"
                    onclick="askAI('Outlook')">

                    <span class="category-icon">📧</span>

                    <span>
                        <strong>Outlook</strong>
                        <small>Email & Microsoft 365</small>
                    </span>

                </button>


                <button
                    class="chat-option category-button"
                    onclick="askAI('Windows')">

                    <span class="category-icon">🖥️</span>

                    <span>
                        <strong>Windows</strong>
                        <small>Desktop & OS issues</small>
                    </span>

                </button>


                <button
                    class="chat-option category-button"
                    onclick="askAI('Internet')">

                    <span class="category-icon">🌐</span>

                    <span>
                        <strong>Internet</strong>
                        <small>Network & Wi-Fi</small>
                    </span>

                </button>


                <button
                    class="chat-option category-button"
                    onclick="askAI('Printer')">

                    <span class="category-icon">🖨️</span>

                    <span>
                        <strong>Printer</strong>
                        <small>Printing problems</small>
                    </span>

                </button>


                <button
                    class="chat-option category-button"
                    onclick="askAI('Password')">

                    <span class="category-icon">🔑</span>

                    <span>
                        <strong>Password</strong>
                        <small>Login & account access</small>
                    </span>

                </button>

            </div>

        </main>


        <!-- INPUT -->

        <div class="input-area">

            <textarea
                id="question"
                placeholder="Ask your IT question..."
            ></textarea>

            <button
                class="send-button"
                onclick="askAI()">

                Send
                <span>➜</span>

            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
